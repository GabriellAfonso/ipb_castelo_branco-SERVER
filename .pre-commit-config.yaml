repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Resolves python from PATH, so it uses whichever virtualenv is active.
        # Do not hard-code an interpreter path here: the previous absolute path to
        # a WSL venv broke every commit made from Windows.
        entry: bash -c 'cd server && python -m mypy .'
        language: system
        types: [python]
        pass_filenames: false
