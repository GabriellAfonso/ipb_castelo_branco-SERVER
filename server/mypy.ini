[mypy]
plugins = mypy_django_plugin.main
strict = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-sentry_sdk]
ignore_missing_imports = True

# django-axes ships no py.typed marker.
[mypy-axes.*]
ignore_missing_imports = True

# Neither does ipware, which arrives as the django-axes[ipware] extra.
[mypy-ipware]
ignore_missing_imports = True
