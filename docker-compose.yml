services:
  ipbcb_server:
    container_name: ipbcb-server-dev
    build:
      context: .
    image: ipbcb-server:dev
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --log-level debug
      "
    env_file:
      - ./.env
    environment:
      DJANGO_ENV: dev
      DJANGO_SETTINGS_MODULE: config.settings.dev
    ports:
      - "8000:8000"
    volumes:
      - ./server:/server
    depends_on:
      ipbcb_db:
        condition: service_healthy

  ipbcb_db:
    container_name: ipbcb-db-dev
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - ipbcb_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    container_name: ipbcb-prometheus-dev
    image: prom/prometheus:v3.4.2
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ipbcb_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ipbcb_server

  grafana:
    container_name: ipbcb-grafana-dev
    image: grafana/grafana:11.6.0
    env_file:
      - ./.env
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ipbcb_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  ipbcb_postgres_data_dev:
  ipbcb_prometheus_data:
  ipbcb_grafana_data:
