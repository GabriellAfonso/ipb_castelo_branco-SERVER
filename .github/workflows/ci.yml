name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check server/

      - name: Security scan (bandit)
        run: bandit -r server/ -c pyproject.toml

      # The only gate that looks at the dependencies instead of at our own code. Pillow
      # decodes uploaded images and Django serves every request, so a published advisory
      # there is live exposure that ruff, bandit and mypy cannot see. Blocking on purpose:
      # a red build is the only reminder that does not depend on remembering to look.
      # To unblock a bad-timing advisory: --ignore-vuln GHSA-xxxx, with a dated comment.
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --strict

      # Catches a production settings module that stopped being production-hardened.
      # Values are placeholders: this asserts the module's shape, not the real secrets.
      - name: Django deploy checks
        working-directory: server
        env:
          DJANGO_ENV: prod
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: eb7Qk2vX9pLm4TzR8sNwJ5yHcA3dGfUxPqBnMeVtZrK6WjSyD1
          GOOGLE_CLIENT_ID: ci-only
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Type check (mypy)
        working-directory: server
        run: mypy .

      - name: Check unmigrated model changes
        working-directory: server
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: server
        run: pytest

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t ipbcb:ci .
