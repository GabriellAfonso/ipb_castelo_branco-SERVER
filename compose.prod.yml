services:
  ipbcb_server:
    container_name: ipbcb-server-prod
    build:
      context: .
    image: ipbcb-server:prod
    command:
    - sh
    - -c
    - |
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.asgi:application \
        -k uvicorn.workers.UvicornWorker \
        --bind 0.0.0.0:8000 \
        --workers 4 \
        --timeout 60 \
        --access-logfile - \
        --error-logfile - \
        --capture-output
    env_file:
      - ./.env
    # Declared here, not in .env: `environment` wins over `env_file`, so a stale
    # DJANGO_SETTINGS_MODULE in .env can no longer boot production on dev settings.
    environment:
      DJANGO_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ./server/static/:/server/static/
      - ./server/media:/server/media/
    depends_on:
      ipbcb_db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - proxy-network

  ipbcb_db:
    container_name: ipbcb-db-prod
    image: postgres:16-alpine
    env_file:
      - ./.env
    volumes:
      - ipbcb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - proxy-network

  prometheus:
    container_name: ipbcb-prometheus-prod
    image: prom/prometheus:v3.4.2
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ipbcb_prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - proxy-network

  grafana:
    container_name: ipbcb-grafana-prod
    image: grafana/grafana:11.6.0
    # Its own file, not ./.env: Grafana has a login form open to the internet and needs
    # none of the application secrets. Sharing ./.env put DJANGO_SECRET_KEY and
    # POSTGRES_PASSWORD one `printenv` away from whoever got into this container.
    env_file:
      - ./.env.grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ipbcb_grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - proxy-network

volumes:
  ipbcb_postgres_data:
  ipbcb_prometheus_data:
  ipbcb_grafana_data:

networks:
  proxy-network:
    external: true